name: Repository checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  setup-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate setup and dependency graph
        run: python scripts/validate_setup.py
      - name: Test task handoff transitions and CC-01 fixtures
        run: python -m unittest discover -s tests -v
      - name: Show initial graph (not live status)
        run: python scripts/taskboard.py --offline

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest
      - name: Generated contracts are current
        run: uv run python -m app.contracts.export --check

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Generated TypeScript contracts are current
        run: |
          npm run gen:contracts
          git diff --exit-code -- src/generated
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
